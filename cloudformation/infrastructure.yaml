AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Event-driven S3 to Lambda to AWS Glue ETL pipeline.
  Creates the complete ETL infrastructure including S3 buckets,
  IAM roles and policies, EventBridge, Lambda, Glue workflow,
  Glue job, crawlers, triggers, and Data Catalog database.

Resources:

  # ==========================================================
  # INPUT S3 BUCKET
  # ==========================================================

  PipelineBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

    Properties:
      BucketName: !Sub "movie-etl-input-${AWS::AccountId}-${AWS::Region}"

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7


  # ==========================================================
  # OUTPUT S3 BUCKET
  # ==========================================================

  OutputBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

    Properties:
      BucketName: !Sub "movie-etl-output-${AWS::AccountId}-${AWS::Region}"

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7


  # ==========================================================
  # INPUT BUCKET POLICY
  # ==========================================================

  PipelineBucketPolicy:
    Type: AWS::S3::BucketPolicy

    Properties:
      Bucket: !Ref PipelineBucket

      PolicyDocument:
        Version: '2012-10-17'

        Statement:

          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"

            Action:
              - s3:*

            Resource:
              - !GetAtt PipelineBucket.Arn
              - !Sub "${PipelineBucket.Arn}/*"

            Condition:
              Bool:
                aws:SecureTransport: false


  # ==========================================================
  # OUTPUT BUCKET POLICY
  # ==========================================================

  OutputBucketPolicy:
    Type: AWS::S3::BucketPolicy

    Properties:
      Bucket: !Ref OutputBucket

      PolicyDocument:
        Version: '2012-10-17'

        Statement:

          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"

            Action:
              - s3:*

            Resource:
              - !GetAtt OutputBucket.Arn
              - !Sub "${OutputBucket.Arn}/*"

            Condition:
              Bool:
                aws:SecureTransport: false


  # ==========================================================
  # GLUE WORKFLOW
  # ==========================================================

  MovieETLWorkflow:
    Type: AWS::Glue::Workflow

    Properties:
      Name: movie-etl-workflow

      Description: >
        Workflow for the movie data ETL pipeline.


  # ==========================================================
  # GLUE JOB IAM ROLE
  # ==========================================================

  GlueJobRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: movie-etl-glue-job-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - glue.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # ------------------------------------------------------
        # GLUE JOB S3 ACCESS
        # ------------------------------------------------------

        - PolicyName: GlueJobS3Access

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              # Read from the input bucket
              - Sid: ReadInputBucket
                Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  - !GetAtt PipelineBucket.Arn

              - Sid: ReadInputObjects
                Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - !Sub "${PipelineBucket.Arn}/input/*"


              # Read/write required temporary files
              - Sid: GlueTempBucketAccess
                Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  - !GetAtt PipelineBucket.Arn

              - Sid: GlueTempObjectAccess
                Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject

                Resource:
                  - !Sub "${PipelineBucket.Arn}/temp/*"


              # Write transformed data to output bucket
              - Sid: WriteOutputObjects
                Effect: Allow

                Action:
                  - s3:PutObject
                  - s3:GetObject

                Resource:
                  - !Sub "${OutputBucket.Arn}/output/*"


              # List output bucket
              - Sid: ListOutputBucket
                Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  - !GetAtt OutputBucket.Arn


        # ------------------------------------------------------
        # GLUE JOB CLOUDWATCH LOGGING
        # ------------------------------------------------------

        - PolicyName: GlueJobLogs

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              - Sid: WriteGlueLogs
                Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: "*"


  # ==========================================================
  # GLUE PYTHON SHELL JOB
  # ==========================================================

  MovieETLJob:
    Type: AWS::Glue::Job

    Properties:
      Name: movie-etl-job

      Role: !GetAtt GlueJobRole.Arn

      Command:
        Name: pythonshell
        PythonVersion: "3.9"

        ScriptLocation: !Sub "s3://${PipelineBucket}/glue/glue_job.py"

      DefaultArguments:

        "--job-language": "python"

        "--TempDir":
          !Sub "s3://${PipelineBucket}/temp/"

        "--enable-continuous-cloudwatch-log": "true"

        "--INPUT_BUCKET":
          !Ref PipelineBucket

        "--OUTPUT_BUCKET":
          !Ref OutputBucket

      MaxCapacity: 0.0625

      ExecutionProperty:
        MaxConcurrentRuns: 1

      Description: >
        Transform movie CSV data using Glue Python Shell.


  # ==========================================================
  # LAMBDA IAM ROLE
  # ==========================================================

  LambdaExecutionRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: movie-etl-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: LambdaStartGlueWorkflow

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              # Lambda CloudWatch logs
              - Sid: LambdaLogging
                Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: "*"


              # Lambda can start ONLY this workflow
              - Sid: StartMovieETLWorkflow
                Effect: Allow

                Action:
                  - glue:StartWorkflowRun

                
                Resource:
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:workflow/movie-etl-workflow"
  # ==========================================================
  # LAMBDA FUNCTION
  # ==========================================================

  StartMovieETL:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: start-movie-etl

      Runtime: python3.12

      Handler: index.lambda_handler

      Role: !GetAtt LambdaExecutionRole.Arn

      Timeout: 30

      Environment:
        Variables:

          WORKFLOW_NAME:
            !Ref MovieETLWorkflow

      Code:
        ZipFile: |

          import boto3
          import os
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          glue = boto3.client("glue")

          WORKFLOW_NAME = os.environ["WORKFLOW_NAME"]


          def lambda_handler(event, context):

              logger.info("Received event: %s", event)

              response = glue.start_workflow_run(
                  Name=WORKFLOW_NAME
              )

              workflow_run_id = response["RunId"]

              logger.info(
                  "Started Glue Workflow: %s, Run ID: %s",
                  WORKFLOW_NAME,
                  workflow_run_id
              )

              return {
                  "statusCode": 200,
                  "workflowName": WORKFLOW_NAME,
                  "workflowRunId": workflow_run_id
              }


  # ==========================================================
  # GLUE DATABASE
  # ==========================================================

  MovieDatabase:
    Type: AWS::Glue::Database

    Properties:

      CatalogId:
        !Ref AWS::AccountId

      DatabaseInput:

        Name: movie_etl_db

        Description: >
          Data Catalog database for the movie ETL pipeline.


  # ==========================================================
  # INPUT CRAWLER IAM ROLE
  # ==========================================================

  GlueCrawlerRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: movie-etl-crawler-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - glue.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: GlueInputCrawlerAccess

          PolicyDocument:
            Version: '2012-10-17'

            Statement:

              # List the input bucket
              - Sid: ListInputBucket
                Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  - !GetAtt PipelineBucket.Arn


              # Read files under input/
              - Sid: ReadInputFiles
                Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - !Sub "${PipelineBucket.Arn}/input/*"


              # Glue Data Catalog access
              - Sid: GlueCatalogAccess
                Effect: Allow

                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:GetTable
                  - glue:GetTables
                  - glue:BatchCreatePartition
                  - glue:BatchDeletePartition
                  - glue:UpdatePartition
                  - glue:GetPartition
                  - glue:GetPartitions

                Resource: "*"


              # CloudWatch logs
              - Sid: CrawlerLogging
                Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: "*"


  # ==========================================================
  # INPUT GLUE CRAWLER
  # ==========================================================

  MovieInputCrawler:
    Type: AWS::Glue::Crawler

    Properties:

      Name: movie-input-crawler

      Role:
        !GetAtt GlueCrawlerRole.Arn

      DatabaseName:
        !Ref MovieDatabase

      Targets:

        S3Targets:

          - Path:
              !Sub "s3://${PipelineBucket}/input/"

      SchemaChangePolicy:

        UpdateBehavior: UPDATE_IN_DATABASE

        DeleteBehavior: LOG

      RecrawlPolicy:

        RecrawlBehavior: CRAWL_EVERYTHING


  # ==========================================================
  # START INPUT CRAWLER
  # ==========================================================

  StartMovieETLTrigger:
    Type: AWS::Glue::Trigger

    Properties:

      Name: movie-etl-start-trigger

      Type: ON_DEMAND

      WorkflowName:
        !Ref MovieETLWorkflow

      Actions:

        - CrawlerName:
            !Ref MovieInputCrawler


  # ==========================================================
  # RUN GLUE JOB AFTER INPUT CRAWLER
  # ==========================================================

  RunMovieETLJobTrigger:
    Type: AWS::Glue::Trigger

    Properties:

      Name: movie-etl-job-trigger

      Type: CONDITIONAL

      WorkflowName:
        !Ref MovieETLWorkflow

      StartOnCreation: true

      Predicate:

        Logical: AND

        Conditions:

          - LogicalOperator: EQUALS

            CrawlerName:
              !Ref MovieInputCrawler

            CrawlState: SUCCEEDED

      Actions:

        - JobName:
            !Ref MovieETLJob
  # --------------------------------------------------
  # EVENTBRIDGE - S3 CSV UPLOAD TRIGGER
  # --------------------------------------------------

  S3MovieUploadRule:
    Type: AWS::Events::Rule

    Properties:
      Name: movie-s3-upload-trigger

      Description: Trigger Lambda when a CSV file is uploaded to the input prefix

      EventPattern:
        source:
          - aws.s3

        detail-type:
          - Object Created

        detail:
          bucket:
            name:
              - !Ref PipelineBucket

          object:
            key:
              - wildcard: "input/*.csv"

      State: ENABLED

      Targets:
        - Arn: !GetAtt StartMovieETL.Arn
          Id: StartMovieETLTarget
          
  # ==========================================================
  # ALLOW EVENTBRIDGE TO INVOKE LAMBDA
  # ==========================================================

  AllowEventBridgeInvokeLambda:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref StartMovieETL

      Action:
        lambda:InvokeFunction

      Principal:
        events.amazonaws.com

      SourceArn:
        !GetAtt S3MovieUploadRule.Arn


  # ==========================================================
  # OUTPUT CRAWLER IAM ROLE
  # ==========================================================

  GlueOutputCrawlerRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: movie-etl-output-crawler-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - glue.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: GlueOutputCrawlerAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              # List output bucket
              - Sid: ListOutputBucket
                Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  - !GetAtt OutputBucket.Arn


              # Read transformed output files
              - Sid: ReadOutputFiles
                Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - !Sub "${OutputBucket.Arn}/output/*"


              # Glue Data Catalog access
              - Sid: GlueCatalogAccess
                Effect: Allow

                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:GetTable
                  - glue:GetTables
                  - glue:BatchCreatePartition
                  - glue:BatchDeletePartition
                  - glue:UpdatePartition
                  - glue:GetPartition
                  - glue:GetPartitions

                Resource: "*"


              # CloudWatch logs
              - Sid: CrawlerLogging
                Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: "*"


  # ==========================================================
  # OUTPUT GLUE CRAWLER
  # ==========================================================

  MovieOutputCrawler:
    Type: AWS::Glue::Crawler

    Properties:

      Name: movie-output-crawler

      Role:
        !GetAtt GlueOutputCrawlerRole.Arn

      DatabaseName:
        !Ref MovieDatabase

      Targets:

        S3Targets:

          - Path:
              !Sub "s3://${OutputBucket}/output/"

      SchemaChangePolicy:

        UpdateBehavior: UPDATE_IN_DATABASE

        DeleteBehavior: LOG

      RecrawlPolicy:

        RecrawlBehavior: CRAWL_EVERYTHING


  # ==========================================================
  # RUN OUTPUT CRAWLER AFTER GLUE JOB
  # ==========================================================

  RunMovieOutputCrawlerTrigger:
    Type: AWS::Glue::Trigger

    Properties:

      Name: movie-output-crawler-trigger

      Type: CONDITIONAL

      WorkflowName:
        !Ref MovieETLWorkflow

      StartOnCreation: true

      Predicate:

        Logical: AND

        Conditions:

          - LogicalOperator: EQUALS

            JobName:
              !Ref MovieETLJob

            State: SUCCEEDED

      Actions:

        - CrawlerName:
            !Ref MovieOutputCrawler


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:

  BucketName:

    Description:
      Name of the pipeline input S3 bucket.

    Value:
      !Ref PipelineBucket


  BucketArn:

    Description:
      ARN of the pipeline input S3 bucket.

    Value:
      !GetAtt PipelineBucket.Arn


  OutputBucketName:

    Description:
      Name of the transformed data S3 bucket.

    Value:
      !Ref OutputBucket


  OutputBucketArn:

    Description:
      ARN of the transformed data S3 bucket.

    Value:
      !GetAtt OutputBucket.Arn


  WorkflowName:

    Description:
      Name of the Glue ETL workflow.

    Value:
      !Ref MovieETLWorkflow


  LambdaName:

    Description:
      Name of the Lambda trigger function.

    Value:
      !Ref StartMovieETL


  DatabaseName:

    Description:
      Name of the Glue Data Catalog database.

    Value:
      !Ref MovieDatabase


  CrawlerName:

    Description:
      Name of the input Glue crawler.

    Value:
      !Ref MovieInputCrawler


  OutputCrawlerName:

    Description:
      Name of the output Glue crawler.

    Value:
      !Ref MovieOutputCrawler


  GlueJobName:

    Description:
      Name of the Glue Python Shell ETL job.

    Value:
      !Ref MovieETLJob
name: Destroy AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to confirm infrastructure deletion'
        required: true
        default: 'DELETE'

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Verify deletion confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DELETE" ]; then
            echo "Confirmation failed. Type DELETE exactly."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Check CloudFormation stack
        id: stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1 \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          echo "Stack status: $STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Get S3 bucket names
        id: buckets
        if: steps.stack.outputs.status != 'NOT_FOUND'
        run: |
          INPUT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1 \
            --query "Stacks[0].Outputs[?OutputKey=='InputBucketName'].OutputValue" \
            --output text)

          OUTPUT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1 \
            --query "Stacks[0].Outputs[?OutputKey=='OutputBucketName'].OutputValue" \
            --output text)

          echo "Input bucket: $INPUT_BUCKET"
          echo "Output bucket: $OUTPUT_BUCKET"

          echo "input_bucket=$INPUT_BUCKET" >> "$GITHUB_OUTPUT"
          echo "output_bucket=$OUTPUT_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Empty input S3 bucket
        if: steps.stack.outputs.status != 'NOT_FOUND' && steps.buckets.outputs.input_bucket != ''
        run: |
          echo "Removing all objects from input bucket..."
          aws s3 rm "s3://${{ steps.buckets.outputs.input_bucket }}" \
            --recursive \
            --region ap-south-1

      - name: Empty output S3 bucket
        if: steps.stack.outputs.status != 'NOT_FOUND' && steps.buckets.outputs.output_bucket != ''
        run: |
          echo "Removing all objects from output bucket..."
          aws s3 rm "s3://${{ steps.buckets.outputs.output_bucket }}" \
            --recursive \
            --region ap-south-1

      - name: Verify S3 buckets are empty
        if: steps.stack.outputs.status != 'NOT_FOUND'
        run: |
          if [ -n "${{ steps.buckets.outputs.input_bucket }}" ]; then
            echo "Checking input bucket..."
            aws s3 ls "s3://${{ steps.buckets.outputs.input_bucket }}/" \
              --region ap-south-1 || true
          fi

          if [ -n "${{ steps.buckets.outputs.output_bucket }}" ]; then
            echo "Checking output bucket..."
            aws s3 ls "s3://${{ steps.buckets.outputs.output_bucket }}/" \
              --region ap-south-1 || true
          fi

      - name: Delete CloudFormation stack
        if: steps.stack.outputs.status != 'NOT_FOUND'
        run: |
          echo "Deleting CloudFormation stack..."

          aws cloudformation delete-stack \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1 \
            --role-arn "${{ secrets.CLOUDFORMATION_ROLE_ARN }}"

      - name: Wait for stack deletion
        if: steps.stack.outputs.status != 'NOT_FOUND'
        run: |
          echo "Waiting for CloudFormation deletion..."

          if ! aws cloudformation wait stack-delete-complete \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1; then

            echo "CloudFormation deletion failed."
            echo "Recent stack events:"

            aws cloudformation describe-stack-events \
              --stack-name s3-glue-pipeline-infra \
              --region ap-south-1 \
              --query 'StackEvents[0:20].[Timestamp,ResourceStatus,LogicalResourceId,ResourceStatusReason]' \
              --output table || true

            exit 1
          fi

      - name: Confirm deletion
        run: |
          if aws cloudformation describe-stacks \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1 >/dev/null 2>&1; then

            echo "Stack still exists."
            exit 1
          fi

          echo "======================================"
          echo "AWS application infrastructure deleted"
          echo "======================================"
          echo "Input bucket: ${{ steps.buckets.outputs.input_bucket }}"
          echo "Output bucket: ${{ steps.buckets.outputs.output_bucket }}"
          echo "CloudFormation stack: s3-glue-pipeline-infra"
          echo "======================================"
name: Destroy AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to confirm infrastructure deletion'
        required: true
        default: 'DELETE'

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Verify deletion confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DELETE" ]; then
            echo "Confirmation failed. Type DELETE exactly."
            exit 1
          fi

          echo "Deletion confirmed."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

      - name: Check CloudFormation stack
        id: stack
        shell: bash
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1 \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          echo "Stack status: $STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Get S3 bucket names
        id: buckets
        if: steps.stack.outputs.status != 'NOT_FOUND'
        shell: bash
        run: |
          INPUT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1 \
            --query "Stacks[0].Outputs[?OutputKey=='InputBucketName'].OutputValue" \
            --output text)

          OUTPUT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1 \
            --query "Stacks[0].Outputs[?OutputKey=='OutputBucketName'].OutputValue" \
            --output text)

          if [ -z "$INPUT_BUCKET" ] || [ "$INPUT_BUCKET" = "None" ]; then
            echo "ERROR: Could not determine input bucket."
            exit 1
          fi

          if [ -z "$OUTPUT_BUCKET" ] || [ "$OUTPUT_BUCKET" = "None" ]; then
            echo "ERROR: Could not determine output bucket."
            exit 1
          fi

          echo "Input bucket : $INPUT_BUCKET"
          echo "Output bucket: $OUTPUT_BUCKET"

          echo "input_bucket=$INPUT_BUCKET" >> "$GITHUB_OUTPUT"
          echo "output_bucket=$OUTPUT_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Empty input S3 bucket
        if: steps.stack.outputs.status != 'NOT_FOUND'
        shell: bash
        run: |
          BUCKET="${{ steps.buckets.outputs.input_bucket }}"

          echo "========================================="
          echo "Emptying input bucket: $BUCKET"
          echo "========================================="

          for ATTEMPT in 1 2 3; do
            echo "Cleanup attempt $ATTEMPT..."

            aws s3 rm "s3://$BUCKET" \
              --recursive \
              --region ap-south-1

            REMAINING=$(aws s3api list-objects-v2 \
              --bucket "$BUCKET" \
              --region ap-south-1 \
              --query 'length(Contents || `[]`)' \
              --output text)

            echo "Remaining objects: $REMAINING"

            if [ "$REMAINING" = "0" ]; then
              echo "Input bucket is empty."
              exit 0
            fi

            if [ "$ATTEMPT" -lt 3 ]; then
              echo "Objects are still present. Retrying..."
              sleep 5
            fi
          done

          echo "ERROR: Input bucket is still not empty after 3 attempts."
          aws s3 ls "s3://$BUCKET" --recursive --region ap-south-1 || true
          exit 1

      - name: Empty output S3 bucket
        if: steps.stack.outputs.status != 'NOT_FOUND'
        shell: bash
        run: |
          BUCKET="${{ steps.buckets.outputs.output_bucket }}"

          echo "========================================="
          echo "Emptying output bucket: $BUCKET"
          echo "========================================="

          for ATTEMPT in 1 2 3; do
            echo "Cleanup attempt $ATTEMPT..."

            aws s3 rm "s3://$BUCKET" \
              --recursive \
              --region ap-south-1

            REMAINING=$(aws s3api list-objects-v2 \
              --bucket "$BUCKET" \
              --region ap-south-1 \
              --query 'length(Contents || `[]`)' \
              --output text)

            echo "Remaining objects: $REMAINING"

            if [ "$REMAINING" = "0" ]; then
              echo "Output bucket is empty."
              exit 0
            fi

            if [ "$ATTEMPT" -lt 3 ]; then
              echo "Objects are still present. Retrying..."
              sleep 5
            fi
          done

          echo "ERROR: Output bucket is still not empty after 3 attempts."
          aws s3 ls "s3://$BUCKET" --recursive --region ap-south-1 || true
          exit 1

      - name: Delete CloudFormation stack
        if: steps.stack.outputs.status != 'NOT_FOUND'
        shell: bash
        run: |
          echo "========================================="
          echo "Deleting CloudFormation stack..."
          echo "========================================="

          aws cloudformation delete-stack \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1 \
            --role-arn "${{ secrets.CLOUDFORMATION_ROLE_ARN }}"

          echo "CloudFormation deletion started."

      - name: Wait for stack deletion
        if: steps.stack.outputs.status != 'NOT_FOUND'
        shell: bash
        run: |
          echo "Waiting for CloudFormation deletion..."

          if ! aws cloudformation wait stack-delete-complete \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1; then

            echo "CloudFormation deletion failed."
            echo "Recent stack events:"

            aws cloudformation describe-stack-events \
              --stack-name s3-glue-pipeline-infra \
              --region ap-south-1 \
              --query 'StackEvents[0:20].[Timestamp,ResourceStatus,LogicalResourceId,ResourceStatusReason]' \
              --output table || true

            exit 1
          fi

          echo "CloudFormation stack deleted successfully."

      - name: Confirm deletion
        shell: bash
        run: |
          if aws cloudformation describe-stacks \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1 >/dev/null 2>&1; then

            echo "ERROR: Stack still exists."
            exit 1
          fi

          echo "======================================"
          echo "AWS application infrastructure deleted"
          echo "======================================"
          echo "Input bucket : ${{ steps.buckets.outputs.input_bucket }}"
          echo "Output bucket: ${{ steps.buckets.outputs.output_bucket }}"
          echo "CloudFormation stack: s3-glue-pipeline-infra"
          echo "======================================"
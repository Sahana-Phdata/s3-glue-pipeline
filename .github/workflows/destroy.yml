name: Destroy AWS Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Destroy Complete ETL Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Verify AWS identity
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

      - name: Check CloudFormation stack
        id: check-stack
        run: |
          if aws cloudformation describe-stacks \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1 >/dev/null 2>&1; then

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "CloudFormation stack exists."

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "CloudFormation stack does not exist."

          fi

      - name: Get S3 bucket names
        if: steps.check-stack.outputs.exists == 'true'
        id: get-buckets
        run: |
          INPUT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1 \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)

          OUTPUT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1 \
            --query "Stacks[0].Outputs[?OutputKey=='OutputBucketName'].OutputValue" \
            --output text)

          echo "Input bucket: $INPUT_BUCKET"
          echo "Output bucket: $OUTPUT_BUCKET"

          echo "input_bucket=$INPUT_BUCKET" >> "$GITHUB_OUTPUT"
          echo "output_bucket=$OUTPUT_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Empty input S3 bucket
        if: steps.check-stack.outputs.exists == 'true'
        run: |
          INPUT_BUCKET="${{ steps.get-buckets.outputs.input_bucket }}"

          if [ -n "$INPUT_BUCKET" ] && [ "$INPUT_BUCKET" != "None" ]; then
            echo "Emptying input bucket: $INPUT_BUCKET"

            aws s3 rm "s3://$INPUT_BUCKET" \
              --recursive \
              --region ap-south-1

            echo "Input bucket emptied successfully."
          else
            echo "Input bucket name was not found."
          fi

      - name: Empty output S3 bucket
        if: steps.check-stack.outputs.exists == 'true'
        run: |
          OUTPUT_BUCKET="${{ steps.get-buckets.outputs.output_bucket }}"

          if [ -n "$OUTPUT_BUCKET" ] && [ "$OUTPUT_BUCKET" != "None" ]; then
            echo "Emptying output bucket: $OUTPUT_BUCKET"

            aws s3 rm "s3://$OUTPUT_BUCKET" \
              --recursive \
              --region ap-south-1

            echo "Output bucket emptied successfully."
          else
            echo "Output bucket name was not found."
          fi

      - name: Delete CloudFormation stack
        if: steps.check-stack.outputs.exists == 'true'
        run: |
          echo "Deleting complete ETL infrastructure stack..."

          aws cloudformation delete-stack \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1

          echo "Waiting for CloudFormation stack deletion..."

          aws cloudformation wait stack-delete-complete \
            --stack-name s3-glue-pipeline-infra \
            --region ap-south-1

          echo "========================================="
          echo "Complete ETL infrastructure deleted."
          echo "========================================="

      - name: Nothing to delete
        if: steps.check-stack.outputs.exists == 'false'
        run: |
          echo "========================================="
          echo "CloudFormation stack does not exist."
          echo "Nothing to delete."
          echo "========================================="